<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Menú del Día</title>
  <link rel="stylesheet" href="assets/recursos.css">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/menu.css">
</head>
<body>
  <header class="barra">
    <h1>Generador de Menú del Día</h1>
  </header>

  <main class="contenido">
    <section class="panel">
      <form id="formulario" autocomplete="off">
        <fieldset class="paso">
          <legend><span class="num">1</span> Panadería</legend>
          <div class="opciones">
            <label class="tarjeta">
              <input type="radio" name="panaderia" value="santo-domingo" required>
              <span>Santo Domingo</span>
            </label>
            <label class="tarjeta">
              <input type="radio" name="panaderia" value="vilanova">
              <span>Vilanova</span>
            </label>
          </div>
        </fieldset>

        <fieldset class="paso" id="paso-opciones" disabled>
          <legend><span class="num">2</span> Opciones de menú</legend>
          <div class="opciones">
            <label class="tarjeta pequena"><input type="radio" name="opciones" value="2" required><span>2</span></label>
            <label class="tarjeta pequena"><input type="radio" name="opciones" value="3"><span>3</span></label>
            <label class="tarjeta pequena"><input type="radio" name="opciones" value="4"><span>4</span></label>
          </div>
        </fieldset>

        <fieldset class="paso" id="paso-menu" disabled>
          <legend><span class="num">3</span> Menú</legend>

          <div class="comunes">
            <label>Sopa
              <input type="text" name="sopa" placeholder="Ej: Sopa de res">
            </label>
            <label>Jugo
              <input type="text" name="jugo" placeholder="Ej: Jugo de mango">
            </label>
            <label>Precio
              <input type="text" name="precio" inputmode="numeric" placeholder="Ej: 20000">
            </label>
          </div>

          <div id="lista-menus"></div>

          <div class="acciones">
            <button type="button" id="btn-limpiar" class="secundario">Limpiar</button>
            <button type="button" id="btn-compartir" class="secundario" hidden>Compartir</button>
            <button type="submit" id="btn-pdf">Descargar PDF</button>
          </div>
        </fieldset>
      </form>
    </section>

    <section class="vista">
      <h2>Vista previa</h2>
      <div class="vista-marco" id="vista-marco">
        <div class="hoja" id="hoja"></div>
      </div>
      <p class="nota" id="nota-vista">Selecciona la panadería y el número de opciones para ver el formato.</p>
    </section>
  </main>

  <template id="tpl-menu">
    <div class="bloque-menu">
      <h3></h3>
      <label>Proteína <input type="text" data-campo="proteina"></label>
      <label>Acompañamiento 1 <input type="text" data-campo="acomp1"></label>
      <label>Acompañamiento 2 <input type="text" data-campo="acomp2"></label>
      <label>Ensalada <input type="text" data-campo="ensalada"></label>
    </div>
  </template>

  <script src="vendor/html2canvas.min.js"></script>
  <script src="vendor/jspdf.umd.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
